{% extends "base.html" %}
{% block title %}تحلیل زایچه — نجوم اطلس{% endblock %}

{% block content %}
<div class="shell">
    <div class="hero">
        <div class="hero__logo">🌟</div>
        <h1>تحلیل زایچه تولد</h1>
        <p class="subtitle">تحلیل جامع نجومی بر اساس نجوم احکامی ایرانی-اسلامی</p>
    </div>

    <div class="result-box mt-2">
        {{ result | safe }}
    </div>

    <div class="action-buttons">
        <button onclick="window.print()" class="btn btn-secondary" style="width:auto">🖨️ چاپ</button>
        <button onclick="copyToClipboard()" class="btn btn-secondary" style="width:auto">📋 کپی متن</button>
        <a href="/" class="btn btn-primary" style="width:auto">🏠 تحلیل جدید</a>
        <a href="/charts" class="btn btn-secondary" style="width:auto">📚 زایچه‌های ذخیره شده</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function copyToClipboard() {
        const box = document.querySelector('.result-box');
        navigator.clipboard.writeText(box.innerText)
            .then(() => alert('✅ متن با موفقیت کپی شد'))
            .catch(() => alert('❌ خطا در کپی کردن متن'));
    }
</script>
{% endblock %}
